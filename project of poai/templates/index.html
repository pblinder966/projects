<!DOCTYPE html>
<html>
<head>
    <title>AI PDF Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>📄 AI PDF</h2>
        <p>Assistant</p>
        <hr>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="pdf" multiple required>
            <button type="submit">Upload PDF</button>
        </form>

        {% if message %}
            <div class="success">{{ message }}</div>
        {% endif %}
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="main">

        <div class="topbar">
            <h3>Chat with your PDFs</h3>
        </div>

        <div id="chatBox"></div>

        <!-- INPUT AREA -->
        {% if ask_ready %}
        <form id="askForm" class="input-area">
        {% else %}
        <form class="input-area hidden">
        {% endif %}

            <input type="text" id="query" placeholder="Ask anything..." required>
            <button type="submit">➤</button>
        </form>

    </div>

</div>

<script>
const chatBox = document.getElementById("chatBox");

function addMessage(text, className) {
    let div = document.createElement("div");
    div.className = className;
    div.innerHTML = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

async function typeEffect(el, text, speed = 12) {
    el.innerHTML = "";
    for (let i = 0; i < text.length; i++) {
        el.innerHTML += text[i];
        await new Promise(r => setTimeout(r, speed));
    }
}

document.getElementById("askForm")?.addEventListener("submit", async function(e){
    e.preventDefault();

    let query = document.getElementById("query").value;

    addMessage(query, "user");

    let loading = addMessage("Thinking...", "ai");

    let response = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "query=" + encodeURIComponent(query)
    });

    let data = await response.json();

    loading.remove();

    if (data.type === "answer") {
        let ai = addMessage("", "ai");
        await typeEffect(ai, data.message);
    }

    if (data.type === "fallback") {
        let ai = addMessage(data.message, "ai");
        ai.innerHTML += `
            <br><br>
            <a href="${data.google}" target="_blank">
                <button class="google">Search Google</button>
            </a>
        `;
    }

    document.getElementById("query").value = "";
});
</script>

</body>
</html>
